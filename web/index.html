  <!-- ══════════════════════════════════════════════════════════════════
       Yazı tipi bağlantısını ÖNDEN kur (A2 — 6 Kasım 2026)

       Denetimde "Inter ve Outfit'i pakete göm" diye yazmıştım; ölçünce
       tersi çıktı. Flutter web, pubspec'teki her fontu AÇILIŞTA indiriyor
       (FontAwesome notunda da yazdığı gibi). Türkçe alt kümeye indirilmiş
       TTF'ler bile ağırlık başına ~55 KB; gerçekten kullanılan 13 varyant
       607 KB eder ve hepsi ilk boyamadan ÖNCE inerdi. google_fonts ise
       yalnız o ekranda görünen varyantı, woff2 olarak (~18 KB) ve sonradan
       çekiyor. Gömmek bayt olarak kayıptı — bu turda 945 KB kazanmışken
       500 KB'ı geri vermek olurdu.

       Geriye kalan gerçek maliyet bayt değil, el sıkışma: DNS + TLS +
       bağlantı, yazı tipi baytı akmaya başlamadan önce ~150-300 ms.
       preconnect bunu uygulama açılırken, paralelde hallediyor. Bedeli
       iki satır.

       crossorigin şart: yazı tipleri CORS ile çekiliyor, bayrak olmazsa
       tarayıcı ikinci bir bağlantı açıyor ve önden kurulan boşa gidiyor.
       ══════════════════════════════════════════════════════════════════ -->

  <!-- ══════════════════════════════════════════════════════════════════
       CSP ihlallerini konsola topla (8 Kasım 2026)

       Politika firebase.json'da ve RAPORLAMA kipinde:
       Content-Security-Policy-Report-Only. Hiçbir şeyi engellemiyor,
       yalnızca ihlali bildiriyor.

       Neden doğrudan zorlayıcı kipe geçmiyoruz: uygulama on ikiden fazla
       dış kökene bağlanıyor (Supabase, Open-Meteo, Nominatim, üç ayrı
       CORS vekili, Yahoo Finance, YouTube, Firebase). connect-src'de
       EKSİK kalan tek bir giriş, o özelliği hata vermeden kırar — hava
       durumu kartı boş gelir, emtia fiyatı gelmez ve sebebi hiçbir yerde
       görünmez.

       Bu dinleyici ihlalleri konsola yazıyor. Birkaç gün gerçek
       kullanımda toplandıktan sonra liste tamamlanır ve başlık
       `Content-Security-Policy` olarak zorlayıcı kipe alınır.
       ══════════════════════════════════════════════════════════════════ -->
  <script>
    document.addEventListener('securitypolicyviolation', function (e) {
      console.warn('[CSP] engellenecekti:', e.violatedDirective, '\u2192', e.blockedURI);
    });
  </script>

  <script>
    // Rota artık adresin `#` sonrasında değil, yolun kendisinde tutuluyor
    // (bkz. lib/core/utils/url_strategy.dart). Daha önce kopyalanmış ya da yer
    // imine eklenmiş `/#/haber/123` biçimindeki eski adresler boşa düşmesin
    // diye açılıştan önce yola çevriliyor. Flutter yüklenmeden çalıştığı için
    // uygulama doğru rotayla başlıyor, gözle görülür bir sıçrama olmuyor.
    (function () {
      var hash = window.location.hash;
      if (hash.length > 2 && hash.charAt(1) === '/') {
        window.history.replaceState(null, '', hash.slice(1));
      }
    })();

    // NOT: burada `instant-splash` sınıfını kuran bir blok vardı.
    //
    // Dayanağı şuydu: iOS startup görseli, eski açılış ekranının giriş
    // animasyonu BİTTİKTEN sonraki durgun hâlinin fotoğrafıydı; HTML
    // katmanı devralırken animasyonu baştan oynatsa logo bir kez daha
    // yükselirdi. Mozaikte böyle bir giriş animasyonu YOK — ekran ilk
    // kareden itibaren dolu ve startup görseli de aynı desenin durgun
    // bir fotoğrafı (scripts/ios_acilis_gorselleri.py). Devralma zaten
    // sürekli, bastırılacak bir şey kalmadı.
  </script>

  <style>
    html, body {
      margin: 0;
      overscroll-behavior-x: none;
      overscroll-behavior-y: none;
      /* Uygulamanın kendi zemini ile birebir aynı: AppColors.creamBackground,
         app_theme.dart:49'daki scaffoldBackgroundColor. Açılış ekranı
         kalkarken ALTINDAN ÇIKAN renk ile ÜSTTEKİ renk aynı olduğu için
         devir teslimde ton sıçraması olmuyor — logo silinir, zemin yerinde
         durur. Önceki koyu yeşil (#174E38) burada bir flaşa yol açıyordu:
         main.dart:134 temayı ThemeMode.light'a kilitliyor, yani ekran her
         açılışta koyu yeşilden krem beyaza atlıyordu. Üstelik o yeşil
         AppColors'ta yoktu, yalnızca bu dosyada yaşayan tek kullanımlık bir
         renkti. */
      background-color: #F6F1E7;
    }

    /* ── Açılış ekranı — mozaik ───────────────────────────────────────────
       Flutter'ın ilk karesi gelene kadar görünen katman.

       ESKİ HÂLİ logo + marka yazısı + slogandı. Üç katmanlı bir giriş
       animasyonu vardı ve iyi işlenmişti; sorun işçilikte değil, PREMİSTE:
       içeriği olmayan bir ekran ne kadar iyi tasarlanırsa tasarlansın
       "dolgu" gibi okunuyordu. Logoyu değiştir, aynı ekran bir fintek
       uygulamasının açılışı olurdu.

       Yeni hâli portalın KENDİ haberlerinin görsellerinden kuruluyor:
       45 derecede, ters yönde akan şeritlerde küçük kareler. Üretilmiş
       tasarımın taklit edemediği tek şey veridir; bu ekranda o var.

       ANINDA DOLU GELİYOR. Her karenin altında hikâye hattı için zaten
       ürettiğimiz LQIP ön izleme duruyor (571 bayt, HTML'e gömülü).
       Ekran boş değil bulanık açılıyor; net kareler indikçe netleşiyor
       ve bu netleşme beklemenin kendisini anlatıyor — ayrı bir ilerleme
       çubuğuna gerek kalmıyor.                                         */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      background-color: #F6F1E7;
      overflow: hidden;
      transition: opacity 460ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    #splash.is-hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* Döndürülmüş tuvalin kenarı, ekranı 45 derecede TAM kaplayacak en
       küçük ölçü: (genişlik + yükseklik) / √2. Büyüğü boşuna düğüm
       üretiyor, küçüğü köşeleri boş bırakıyor. */
    #mozaik {
      position: absolute; top: 50%; left: 50%;
      width: calc((100vw + 100vh) * 0.7072);
      height: calc((100vw + 100vh) * 0.7072);
      transform: translate(-50%, -50%) rotate(-45deg);
      display: flex; flex-direction: column; justify-content: center;
      gap: var(--ara, 10px);
      --boy: 124px; --ara: 10px;
    }
    .serit { height: var(--boy); overflow: hidden; flex: 0 0 auto; }

    /* Kısayol DEĞİL, ayrı ayrı yazılıyor. Prototipte kısayol
       `animation: kay var(--hiz) linear infinite` biçimindeydi ve `--hiz`
       hiç tanımlanmıyordu; TANIMSIZ bir var() kısayolun tamamını geçersiz
       kılıyor, yani animation-name hiç kurulmuyor ve kareler donuyordu.
       Süreyi sonradan JS ile atamak da kurtarmıyor — adı olmayan
       animasyonun süresi çalışmıyor. */
    .akis {
      display: flex; gap: var(--ara, 10px); width: max-content;
      will-change: transform;
      animation-name: kay;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
      animation-duration: 120s;
    }
    .serit.ters .akis { animation-direction: reverse; }
    @keyframes kay {
      from { transform: translate3d(0, 0, 0); }
      to   { transform: translate3d(-50%, 0, 0); }
    }

    /* LQIP arka plan olarak duruyor: 24 piksellik görsel büyütülünce
       zaten yumuşak, ayrı bir blur filtresi gerekmiyor. Kare başına İKİ
       değil TEK <img> düğümü kalıyor. */
    .kare {
      position: relative; width: var(--boy); height: var(--boy);
      flex: 0 0 auto; border-radius: 4px; overflow: hidden;
      background: #E6DECF 50%/cover no-repeat;
    }
    /* Net katman: TEK sprite'ın ilgili karesi. Ayrı <img> yerine arka
       plan konumu kullanılıyor çünkü 35 görselin hepsi aynı dosyada.
       Sprite indiğinde `#mozaik.net` sınıfı kuruluyor ve bütün kareler
       AYNI ANDA netleşiyor — tek tek inen kareler "yavaş yavaş
       yükleniyor" hissi veriyordu. */
    .kare i {
      position: absolute; inset: 0; display: block;
      background-image: var(--sprite);
      background-repeat: no-repeat;
      opacity: 0; transition: opacity 420ms ease-out;
    }
    #mozaik.net .kare i { opacity: 1; }

    /* Marka karesi: haberlerin arasında, onlarla AYNI ölçüde bir kare —
       ayrı bir katman ya da ortada duran bir kilit birim değil, akışın
       parçası. Yalnızca TEK şeritte; her şeritte olunca ekran "haber"
       değil "marka deseni" gibi okunuyordu. */
    .kare.marka { background: #F1EADC; display: flex; align-items: center; justify-content: center; }
    .kare.marka img { position: static; width: 62%; height: auto; opacity: 1; display: block; }

    /* Kenarlar yumuşasın: mozaik kesilmiş değil, ekranın dışına taşıyor gibi. */
    #vinyet {
      position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(118% 88% at 50% 50%,
        rgba(246,241,231,0) 40%, rgba(246,241,231,.55) 78%, rgba(246,241,231,.92) 100%);
    }

    /* Yavaş bağlantı için geç geri bildirim. Hızlı açılışta hiç görünmüyor. */
    /* Bekleme çubuğu.
       Eskiden 2.600 ms'de beliriyordu ama MIN_MS 2.500'e çekilince
       ekran çoğu zaman o eşiğe varmadan kalkıyordu — yani çubuk pratikte
       HİÇ görünmüyordu. Artık erken giriyor ve fotoğrafların üstünde
       okunacak kadar belirgin: 2 px yerine 4, soluk gri yerine koyu
       zemin üstünde marka yeşili. */
    #splash-wait {
      position: absolute; left: 50%; transform: translateX(-50%);
      bottom: calc(env(safe-area-inset-bottom, 0px) + 64px);
      width: 148px; height: 4px; border-radius: 4px; overflow: hidden;
      background: rgba(42, 35, 24, 0.22);
      box-shadow: 0 0 0 4px rgba(246, 241, 231, 0.55);
      opacity: 0; z-index: 2; transition: opacity 420ms ease-out;
    }
    #splash-wait.is-on { opacity: 1; }
    #splash-wait i {
      position: absolute; inset: 0 auto 0 0; width: 42%; border-radius: 4px;
      background: #31603C;
      animation: splash-wait-run 1500ms cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }
    @keyframes splash-wait-run {
      0%   { transform: translateX(-105%); }
      100% { transform: translateX(245%); }
    }

    @media (prefers-reduced-motion: reduce) {
      .akis, #splash-wait i { animation: none; }
      #splash { transition: none; }
    }
  </style>

<body>
  <!-- Görsellerin hepsi markanın kendi çizimi. alt metni yalnızca kilit
       birimde var: üçü ayrı ayrı okunursa ekran okuyucu aynı adı üç kez
       söyler. -->
  <!-- Mozaik JS ile kuruluyor: şerit ve kare sayısı görüntü alanından
       hesaplanıyor, sabit bir işaretleme yazılamaz. `aria-hidden`: ekran
       okuyucu için burada okunacak bir şey yok, altındaki sunucu
       içeriği zaten okunuyor. -->
  <div id="splash" role="status" aria-label="Tarım Portalı yükleniyor">
    <div id="mozaik" aria-hidden="true"></div>
    <div id="vinyet" aria-hidden="true"></div>
    <div id="splash-wait" aria-hidden="true"><i></i></div>
  </div>

  <!-- Sunucuda üretilen okunabilir içerik.
       CanvasKit her şeyi tuvale PİKSEL olarak çiziyor; DOM'da tek bir metin
       düğümü bile oluşmuyor. Ölçüldü (6 Eylül 2026, canlı site): haber sayfası
       tam yüklendiğinde `document.body.innerText.length` = 0, `<a>` = 0.
       Yani Google haberin gövdesini DEĞİL, yalnızca <head>'deki 160 karakterlik
       açıklamayı görebiliyordu.

       `ogRenderer` (haber) ve `homeRenderer` (ana sayfa) bu iki işaret arasını
       gerçek HTML ile dolduruyor. Dolduramazlarsa arada hiçbir şey kalmıyor ve
       sayfa eskisi gibi çalışmaya devam ediyor — zenginleştirme başarısız
       olabilir, sayfa kırılmaz.

       Kullanıcı bunu GÖRMÜYOR: üstünde `z-index: 2147483647` ile tam ekran
       `#splash` var ve Flutter ilk kareyi çizer çizmez aşağıdaki `hide()`
       bloğu bu düğümü DOM'dan siliyor. Gizleme (cloaking) değil — sunulan
       metin ile uygulamanın gösterdiği metin birebir aynı, yalnızca biri
       ötekinin üstünü örtüyor. -->

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>

  <!-- Mozaik verisi: derleme anında buraya gömülüyor
       (scripts/ana_sayfa_linkleri.py). Boş kalırsa mozaik çizilmiyor ve
       ekran düz krem kalıyor — kırılmıyor. -->
  <!-- MOZAIK_START --><!-- MOZAIK_END -->

  <script>
    // ══════════════════════════════════════════════════════════════════
    //  Mozaik açılış ekranı
    // ──────────────────────────────────────────────────────────────────
    //  Veri İKİ kaynaktan gelebiliyor, sırayla:
    //
    //  1. localStorage — uygulama bir önceki açılışta O GÜNÜN haberlerini
    //     buraya yazıyor. Ek istek yok, görsel taze.
    //  2. Gömülü set — derleme anında konan yedek. İlk ziyarette ve
    //     localStorage boşsa bu kullanılıyor.
    //
    //  Üçüncü bir yol (her açılışta sunucudan çekmek) BİLEREK yok:
    //  mozaiğin anında dolması gerekiyor, bir gidiş-dönüş beklemek
    //  ekranın tek iyi özelliğini öldürürdü.
    // ══════════════════════════════════════════════════════════════════
    (function () {
      var VERI = window.__MOZAIK;
      if (!VERI || !VERI.kareler || VERI.kareler.length < 12) return;
      var KARELER = VERI.kareler;

      var LOGO = 'icons/splash-mark.png';
      var LOGO_ARALIK = 14;   // kaç karede bir marka karesi
      var LOGO_SERIT = 3;     // yalnızca bu şeritte (0 = en üst)
      var HIZ = 10;           // px/sn — iki cihazda denenerek seçildi

      var mozaik = document.getElementById('mozaik');
      if (!mozaik) return;
      mozaik.style.setProperty('--sprite', 'url(mozaik.jpg)');

      function boy() {
        // Sabit piksel iki uçta da yanlış: telefonda ekranın yarısı,
        // masaüstünde sekizde biri. Kısa kenara bağlı iki değer, iki
        // cihazda denenerek seçildi.
        return Math.min(innerWidth, innerHeight) < 600 ? 124 : 200;
      }

      function kur() {
        var BOY = boy();
        var ARA = Math.max(8, Math.round(BOY * 0.07));
        mozaik.innerHTML = '';
        mozaik.style.setProperty('--boy', BOY + 'px');
        mozaik.style.setProperty('--ara', ARA + 'px');

        var kenar = (innerWidth + innerHeight) * 0.7072;
        var seritSayisi = Math.ceil(kenar / (BOY + ARA)) + 1;
        // Dikişsiz döngü: kayma %50'ye varınca liste başa dönüyor, ek
        // yeri görünmüyor. Bu yüzden içerik tuvalin iki katı.
        var yarim = Math.ceil(kenar / (BOY + ARA)) + 2;
        // Sprite ızgarası kare başına ölçekleniyor: 6 sütun → %600.
        var olcek = (VERI.sutun * 100) + '% ' + (VERI.satir * 100) + '%';

        for (var i = 0; i < seritSayisi; i++) {
          var serit = document.createElement('div');
          serit.className = 'serit' + (i % 2 ? ' ters' : '');
          var akis = document.createElement('div');
          akis.className = 'akis';
          var markaSeridi = (i === LOGO_SERIT);

          for (var j = 0; j < yarim * 2; j++) {
            var kare = document.createElement('div');
            if (markaSeridi && j % LOGO_ARALIK === 2) {
              kare.className = 'kare marka';
              var mi = document.createElement('img');
              mi.src = LOGO; mi.alt = ''; mi.setAttribute('aria-hidden', 'true');
              kare.appendChild(mi);
            } else {
              var k = KARELER[(i * 5 + j) % KARELER.length];
              kare.className = 'kare';
              if (k.l) kare.style.backgroundImage = 'url(' + k.l + ')';
              var net = document.createElement('i');
              net.style.backgroundSize = olcek;
              net.style.backgroundPosition = k.x + '% ' + k.y + '%';
              kare.appendChild(net);
            }
            akis.appendChild(kare);
          }
          serit.appendChild(akis);
          mozaik.appendChild(serit);

          // Süre TAHMİNDEN değil GERÇEK genişlikten: animasyon %50
          // kayıyor, yani yol scrollWidth'in yarısı. Sabit süre verilseydi
          // şerit içeriği ekrana göre uzadığı için masaüstünde daha hızlı
          // akardı (ölçüldü: 1,6 kat).
          var hiz = HIZ * (1 + (i % 3) * 0.22);
          akis.style.animationDuration = ((akis.scrollWidth / 2) / hiz).toFixed(1) + 's';
        }
      }

      kur();

      // Sprite TEK parça: indiğinde bütün kareler aynı anda netleşiyor.
      // <head>'deki preload zaten indirmeye başlamış oluyor; buradaki
      // Image yalnızca "indi mi" sorusunu cevaplıyor, ikinci bir istek
      // açmıyor (aynı adres, aynı önbellek girdisi).
      var sprite = new Image();
      sprite.onload = function () { mozaik.classList.add('net'); };
      sprite.src = 'mozaik.jpg';

      // Ekran döndüğünde şerit ve kare sayısı yeniden hesaplanmalı.
      var zaman;
      addEventListener('resize', function () {
        clearTimeout(zaman);
        zaman = setTimeout(function () {
          var netti = mozaik.classList.contains('net');
          kur();
          if (netti) mozaik.classList.add('net');
        }, 220);
      });
    })();
  </script>

  <script>
    // Açılış ekranı iki koşul birden sağlanınca kalkar:
    //   1) Flutter ilk karesini çizmiş olmalı  → altında hazır bir sayfa dursun
    //   2) en az MIN_MS geçmiş olmalı          → hızlı açılışta göz kırpıp
    //                                            kaybolmasın
    //
    // MIN_MS eskiden sabit 3000'di. İkinci koşulun ölçüsü animasyonun süresi
    // olmalı, keyfi bir sayı değil: giriş 60+980 / 340+820 / 620+760 ile
    // 1380 ms'de bitiyor, 1500 onu güvenle kapsıyor. 3 saniye, önbellekten
    // 400 ms'de açılan bir uygulamayı yavaş gösteriyordu.
    //
    // Aynı oturumda ikinci kez gelen kullanıcı açılışı zaten gördü; ona
    // animasyonu baştan izletmenin bir anlamı yok, yalnızca bekletir.
    (function () {
      // `instant` / `seen` dalları KALDIRILDI: süre artık koşulsuz.
      // SABİT 2500 — kullanıcı kararı (9 Kasım 2026): "bu ekran ne olursa
      // olsun en az 2-3 saniye görünsün, daha hızlı kaybolması gereken
      // hâllerde bile".
      //
      // Eskiden üç ayrı değer vardı: 1500 (ilk ziyaret), 700 (aynı
      // oturumda tekrar), 400 (iOS ana ekrandan). Yani bu değişiklik bazı
      // durumlarda açılışı YAVAŞLATIYOR — iOS'ta ana ekrandan açan okur
      // 400 ms yerine 2500 ms bekliyor. Bilinçli bir takas: ekran artık
      // bir dolgu değil, görülmesi istenen bir şey.
      //
      var MIN_MS = 2500;

      // Yavaş bağlantıda ekranın donduğu sanılmasın diye bekleme çizgisi.
      // Eşik MIN_MS'in belirgin üstünde: normal açılışta hiç görünmüyor.
      // Eskiden 2.600 idi ve MIN_MS 2.500'e çekilince çubuk pratikte
      // HİÇ görünmüyordu — kullanıcı "hiç görünmüyor" diye bildirdi.
      // 900 ms: hızlı açılışta bile ekran en az 2,5 saniye duruyor,
      // yani çubuğun görünmesi için bir sebep var.
      var HINT_MS = 900;

      var startedAt = Date.now();
      var done = false;


      function hide() {
        if (done) return;
        done = true;

        // Sunucudan gelen SEO içeriği artık gereksiz: Flutter kendi sayfasını
        // çizdi. DOM'da bırakılırsa ekran okuyucu aynı haberi iki kez okur ve
        // klavyeyle gezinen kullanıcı görünmeyen bağlantılara takılır.
        // `#splash`ten ÖNCE siliniyor: aşağıdaki erken `return` (splash zaten
        // kaldırılmışsa) bu satıra hiç ulaşmamazlık etmesin.
        var ssr = document.getElementById('ssr-content');
        if (ssr) ssr.remove();

        var el = document.getElementById('splash');
        if (!el) return;
        el.classList.add('is-hidden');
        // Geçiş bitince DOM'dan çıkar; sayfanın üstünde ölü bir katman kalmasın.
        setTimeout(function () { el.remove(); }, 560);
      }

      setTimeout(function () {
        if (done) return;
        var w = document.getElementById('splash-wait');
        if (w) w.classList.add('is-on');
      }, HINT_MS);

      window.addEventListener('flutter-first-frame', function () {
        setTimeout(hide, Math.max(0, MIN_MS - (Date.now() - startedAt)));
      });

      // Güvenlik ağı: ilk kare hiç gelmezse (motor yüklenemedi, ağ koptu)
      // açılış ekranı sonsuza kadar kalmasın — arkasındaki hata görülebilsin.
      setTimeout(hide, 20000);
    })();
  </script>
