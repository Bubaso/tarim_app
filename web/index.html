  <script>
    // Rota artık adresin `#` sonrasında değil, yolun kendisinde tutuluyor
    // (bkz. lib/core/utils/url_strategy.dart). Daha önce kopyalanmış ya da yer
    // imine eklenmiş `/#/haber/123` biçimindeki eski adresler boşa düşmesin
    // diye açılıştan önce yola çevriliyor. Flutter yüklenmeden çalıştığı için
    // uygulama doğru rotayla başlıyor, gözle görülür bir sıçrama olmuyor.
    (function () {
      var hash = window.location.hash;
      if (hash.length > 2 && hash.charAt(1) === '/') {
        window.history.replaceState(null, '', hash.slice(1));
      }
    })();

    // iOS'ta ana ekrandan açılışta önce yukarıdaki `apple-touch-startup-image`
    // gösteriliyor: bu görsel, `#splash`in giriş animasyonu BİTTİKTEN sonraki
    // durgun hâlinin fotoğrafı. HTML katmanı devralırken animasyonu baştan
    // oynatsa logo bir kez daha aşağıdan yükselirdi. O yüzden orada animasyon
    // kapatılıp doğrudan son kareyle başlanıyor.
    //
    // Başka hiçbir yerde geçerli değil: sekmede ve Android'de startup görseli
    // diye bir şey yok, animasyon olduğu gibi oynar.
    //
    // `<head>` içinde çalışmak zorunda: gövde boyanmadan karar verilmeli,
    // yoksa animasyon bir an başlayıp kesilir.
    (function () {
      var standalone = window.matchMedia('(display-mode: standalone)').matches ||
                       window.matchMedia('(display-mode: fullscreen)').matches ||
                       window.matchMedia('(display-mode: minimal-ui)').matches ||
                       window.navigator.standalone === true;
      var ios = /iP(hone|ad|od)/.test(navigator.userAgent) ||
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if (standalone && ios) document.documentElement.className += ' instant-splash';
    })();
  </script>

  <style>
    html, body {
      margin: 0;
      overscroll-behavior-x: none;
      overscroll-behavior-y: none;
      /* Yeniden yükleme sırasında beyaz yerine marka rengi görünsün
         (manifest.json'daki background_color ile aynı). */
      background-color: #174E38;
    }

    /* ── Açılış ekranı ────────────────────────────────────────────────────
       Flutter'ın ilk karesi gelene kadar görünen katman. Marka rengi zaten
       arka planda vardı; buraya logo ve motto ekleniyor.
       Kaldırma mantığı sayfanın sonundaki script'te.                        */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      background-color: #174E38;
      transition: opacity 400ms ease-out;
    }

    #splash.is-hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* Logo koyu yeşil ve kahverengi tonlarda; aynı koyulukta bir zeminde
       kaybolurdu. Krem daire hem okunurluğu hem de marka paletini koruyor. */
    #splash-logo {
      width: 148px;
      height: 148px;
      border-radius: 50%;
      background-color: #F6F1E7;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.28);
      animation: splash-rise 600ms cubic-bezier(0.2, 0.7, 0.3, 1) both;
    }

    #splash-logo img {
      display: block;
      width: 108px;
      height: 108px;
    }

    #splash-motto {
      margin: 0;
      /* Uygulamanın kendi yazı tipleri Flutter ile birlikte geliyor; burada
         indirme beklemeden çizilebilen sistem yığını kullanılıyor. */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.22em;
      color: #F6F1E7;
      animation: splash-rise 600ms 140ms cubic-bezier(0.2, 0.7, 0.3, 1) both;
    }

    @keyframes splash-rise {
      from { opacity: 0; transform: translateY(12px) scale(0.94); }
      to   { opacity: 1; transform: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      #splash-logo,
      #splash-motto { animation: none; }
      #splash { transition: none; }
    }

    /* iOS'ta ana ekrandan açılış: startup görseli devralınıyor, giriş
       animasyonu tekrar oynamamalı (bkz. yukarıdaki `instant-splash`). */
    .instant-splash #splash-logo,
    .instant-splash #splash-motto { animation: none; }
  </style>

  <div id="splash">
    <div id="splash-logo"><img src="icons/Icon-512.png" alt="Tarım Portalı"></div>
    <p id="splash-motto">TARIMIN DOĞRU ADRESİ</p>
  </div>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>

  <script>
    // Açılış ekranı iki koşul birden sağlanınca kalkar:
    //   1) Flutter ilk karesini çizmiş olmalı  → altında hazır bir sayfa dursun
    //   2) en az MIN_MS geçmiş olmalı          → hızlı açılışta göz kırpıp
    //                                            kaybolmasın
    (function () {
      var MIN_MS = 3000;
      var startedAt = Date.now();
      var done = false;

      function hide() {
        if (done) return;
        done = true;
        var el = document.getElementById('splash');
        if (!el) return;
        el.classList.add('is-hidden');
        // Geçiş bitince DOM'dan çıkar; sayfanın üstünde ölü bir katman kalmasın.
        setTimeout(function () { el.remove(); }, 500);
      }

      window.addEventListener('flutter-first-frame', function () {
        setTimeout(hide, Math.max(0, MIN_MS - (Date.now() - startedAt)));
      });

      // Güvenlik ağı: ilk kare hiç gelmezse (motor yüklenemedi, ağ koptu)
      // açılış ekranı sonsuza kadar kalmasın — arkasındaki hata görülebilsin.
      setTimeout(hide, 20000);
    })();
  </script>
