<!doctype html><html lang=tr><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>Mozaik acilis - prototip</title>
<style>
html,body{margin:0;height:100%;background:#F6F1E7;overflow:hidden}

/* Döndürülmüş tuvalin kenarı, ekranı 45 derecede TAM kaplayacak en küçük
   ölçü: (genişlik + yükseklik) / √2. Büyüğü boşuna düğüm üretir,
   küçüğü köşeleri boş bırakır. */
#mozaik{
  position:fixed; top:50%; left:50%;
  width:calc((100vw + 100vh) * 0.7072);
  height:calc((100vw + 100vh) * 0.7072);
  transform:translate(-50%,-50%) rotate(-45deg);
  display:flex; flex-direction:column; justify-content:center; gap:var(--ara);
  --boy:0px; --ara:8px;
}
.serit{height:var(--boy); overflow:hidden; flex:0 0 auto}
.akis{display:flex; gap:var(--ara); width:max-content;
      animation:kay var(--hiz) linear infinite; will-change:transform}
.serit.ters .akis{animation-direction:reverse}
@keyframes kay{from{transform:translate3d(0,0,0)} to{transform:translate3d(-50%,0,0)}}

/* LQIP arka plan olarak duruyor: 24 piksellik görsel büyütülünce zaten
   yumuşak, ayrı bir blur filtresi gerekmiyor. Kare başına İKİ değil TEK
   <img> düğümü kalıyor. */
.kare{
  position:relative; width:var(--boy); height:var(--boy); flex:0 0 auto;
  border-radius:4px; overflow:hidden; background:#E6DECF 50%/cover no-repeat;
}
.kare img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
          display:block; opacity:0; transition:opacity 560ms ease-out}
.kare img.geldi{opacity:1}

/* Marka karesi: haberlerin arasında, onlarla AYNI ölçüde bir kare.
   Ayrı bir katman, rozet ya da ortada duran bir kilit birim değil —
   akışın bir parçası. Zemini krem, böylece fotoğrafların arasında
   nefes alan bir boşluk gibi de iş görüyor. */
.kare.marka{background:#F1EADC; display:flex; align-items:center; justify-content:center}
.kare.marka img{position:static; width:62%; height:auto; opacity:1}

/* Kenarlar yumuşasın: mozaik kesilmiş değil, ekranın dışına taşıyor gibi. */
#vinyet{position:fixed; inset:0; pointer-events:none;
  background:radial-gradient(118% 88% at 50% 50%,
    rgba(246,241,231,0) 40%, rgba(246,241,231,.55) 78%, rgba(246,241,231,.92) 100%)}

@media (prefers-reduced-motion: reduce){ .akis{animation:none} }

/* ── Yalnızca PROTOTİP için: canlı ayar paneli ────────────────────────
   Gerçek açılış ekranında bulunmayacak. Burada olmasının sebebi, kare
   boyu ve logo sıklığının ekranda görülmeden karara bağlanamaması. */
#ayar{position:fixed; right:12px; bottom:12px; z-index:9; display:flex;
  flex-direction:column; gap:8px; background:rgba(255,255,255,.92);
  border:1px solid #D9D1BE; border-radius:10px; padding:10px 12px;
  font:13px/1.3 system-ui,sans-serif; color:#2A2318;
  box-shadow:0 2px 14px rgba(42,35,24,.12)}
#ayar div{display:flex; align-items:center; gap:8px; justify-content:space-between}
#ayar b{font-weight:600; font-size:12px; letter-spacing:.02em}
#ayar span{font-variant-numeric:tabular-nums; min-width:46px; text-align:right; color:#6B6153}
#ayar button{width:28px; height:28px; border:1px solid #D9D1BE; background:#fff;
  border-radius:6px; font-size:15px; line-height:1; cursor:pointer; color:#2A2318}
#ayar button:active{background:#F1EADC}
#ayar i{font-style:normal; font-size:11px; color:#8A8273}
</style></head><body>
<div id="mozaik"></div><div id="vinyet"></div>
<div id="ayar">
  <div><b>Kare boyu</b><span id="vBoy"></span>
    <button data-d="boy" data-y="-20">−</button><button data-d="boy" data-y="20">+</button></div>
  <div><b>Logo sıklığı</b><span id="vLogo"></span>
    <button data-d="logo" data-y="-1">−</button><button data-d="logo" data-y="1">+</button></div>
  <div><b>Logo şeridi</b><span id="vSerit"></span>
    <button data-d="serit" data-y="-1">−</button><button data-d="serit" data-y="1">+</button></div>
  <div><b>Akış hızı</b><span id="vHiz"></span>
    <button data-d="hiz" data-y="-10">−</button><button data-d="hiz" data-y="10">+</button></div>
  <div><b>Ekrana göre</b><span id="vOto"></span>
    <button data-d="sifirla" data-y="0">↺</button></div>
  <i>Yalnızca prototip — gerçekte bu panel olmayacak</i>
</div>

var BOY = 0, ARA = 8, LOGO_ARALIK = 14, LOGO_SERIT = 3;

// ── Kare boyu ekrana göre ────────────────────────────────────────────
// Sabit piksel iki uçta da yanlış: telefonda 240 px ekranın yarısı
// (fotoğraf okunuyor, mozaik hissi zayıf), masaüstünde aynı 240 px
// ekranın sekizde biri (desen kalabalıklaşıyor).
//
// Ölçü KISA KENARA bağlanıyor ve iki ucu da sınırlı: telefonda ~225,
// masaüstünde 320'de duruyor. Böylece masaüstünde kareler piksel olarak
// BÜYÜYOR ama ekrana oranla küçülüyor — yani mozaik daha çok kare
// gösteriyor, ki masaüstünde istenen tam olarak bu.
function varsayilanBoy() {
  var kisa = Math.min(innerWidth, innerHeight);
  return Math.round(Math.max(200, Math.min(320, kisa * 0.52)));
}

var BOY_AYAR = 0 > 0 ? 0 : varsayilanBoy();
// Taban hız px/sn. Splash 3-7 saniye yaşıyor; 20 px/sn'de o sürede
// yarım kareden az yol alınıyor ve ekran duruyor gibi görünüyordu.
// 50'de ~5 saniyede bir kare yol var, yani akış gözle görülüyor.
var HIZ_AYAR = 50;
var LOGO_AYAR = LOGO_ARALIK, SERIT_AYAR = LOGO_SERIT;
var ELLE = false;   // panelden dokunulduysa ekran ölçüsü artık ezmiyor

function kur(){
  var mozaik = document.getElementById('mozaik');
  mozaik.innerHTML = '';
  mozaik.style.setProperty('--boy', BOY_AYAR + 'px');
  mozaik.style.setProperty('--ara', Math.max(8, Math.round(BOY_AYAR * 0.07)) + 'px');
  var BOY = BOY_AYAR, ARA = Math.max(8, Math.round(BOY_AYAR * 0.07));
  var LOGO_ARALIK = LOGO_AYAR, LOGO_SERIT = SERIT_AYAR;
  document.getElementById('vBoy').textContent = BOY + ' px';
  document.getElementById('vLogo').textContent = 'her ' + LOGO_ARALIK;
  document.getElementById('vSerit').textContent = (LOGO_SERIT + 1) + '. şerit';
  document.getElementById('vOto').textContent = ELLE ? 'elle' : varsayilanBoy() + ' px';
  document.getElementById('vHiz').textContent = HIZ_AYAR + ' px/sn';
  var kenar = (innerWidth + innerHeight) * 0.7072;
  var seritSayisi = Math.ceil(kenar / (BOY + ARA)) + 1;
  // Dikişsiz döngü için şerit içeriği tuvalin İKİ KATI olmalı: kayma
  // %50'ye varınca liste başa dönüyor ve ek yeri görünmüyor.
  var yarim = Math.ceil(kenar / (BOY + ARA)) + 2;

  var grup = {};

  for (var i = 0; i < seritSayisi; i++) {
    var serit = document.createElement('div');
    serit.className = 'serit' + (i % 2 ? ' ters' : '');
    // Hız SÜREYLE değil PİKSEL/SANİYE ile veriliyor.
    //
    // Sabit süre ekrandan ekrana farklı hız demek: şeridin içeriği
    // görüntü alanına göre uzuyor, aynı sürede daha çok yol kat ediliyor.
    // Ölçüldü — 800x1500'de 33 px/sn olan sürüklenme, 1920x1080'de
    // 52 px/sn oluyordu; masaüstünde mozaik gözle görülür biçimde daha
    // hızlı akıyordu. Süre aşağıda içerik genişliğinden hesaplanıyor.
    // Üç ayrı hız: hepsi aynı hızda akarsa desen donuk duruyor.
    var seritHizi = HIZ_AYAR * (1 + (i % 3) * 0.22);
    var akis = document.createElement('div');
    akis.className = 'akis';

    // Marka karesi YALNIZCA TEK bir şeritte. Her şeritte olunca ekranda
    // onlarca logo birden duruyordu ve mozaik "haber" değil "marka
    // deseni" gibi okunuyordu. Tek şerit, markayı arada bir geçen bir
    // imza hâline getiriyor.
    var markaSeridi = (i === LOGO_SERIT);
    var logoYeri = 2 % LOGO_ARALIK;

    for (var j = 0; j < yarim; j++) {
      var kare = document.createElement('div');
      if (markaSeridi && j % LOGO_ARALIK === logoYeri) {
        kare.className = 'kare marka';
        var m = document.createElement('img');
        m.src = LOGO; m.alt = ''; m.setAttribute('aria-hidden', 'true');
        kare.appendChild(m);
      } else {
        var k = KARELER[(i * 5 + j) % KARELER.length];
        kare.className = 'kare';
        kare.style.backgroundImage = 'url(' + k.l + ')';
        var img = document.createElement('img');
        img.alt = ''; img.setAttribute('aria-hidden', 'true');
        kare.appendChild(img);
        (grup[k.t] = grup[k.t] || []).push(img);
      }
      akis.appendChild(kare);
    }
    // İkinci yarı: birinci yarının birebir kopyası — döngü dikişi olmasın.
    var kopya = akis.cloneNode(true);
    var kopyaImg = kopya.querySelectorAll('.kare:not(.marka) img');
    var asilKare = akis.querySelectorAll('.kare:not(.marka)');
    for (var n = 0; n < kopyaImg.length; n++) {
      var src = asilKare[n].style.backgroundImage;
      // Kopyadaki <img>'leri de aynı adres grubuna yazıyoruz ki birlikte
      // netleşsinler; yoksa şeridin yarısı net, yarısı bulanık kalır.
      var kk = KARELER[(i * 5 + n) % KARELER.length];
      void src;
      (grup[kk.t] = grup[kk.t] || []).push(kopyaImg[n]);
    }
    while (kopya.firstChild) akis.appendChild(kopya.firstChild);

    serit.appendChild(akis);
    mozaik.appendChild(serit);

    // Süre, TAHMİNİ değil GERÇEK genişlikten hesaplanıyor: animasyon
    // %50 kayıyor, yani kat edilen yol `scrollWidth`in yarısı. Tahminle
    // hesaplandığında ayarlanan px/sn ile ölçülen tutmuyordu (26 verilip
    // 19,5 ölçülüyordu).
    var yol = akis.scrollWidth / 2;
    akis.style.animationDuration = (yol / seritHizi).toFixed(1) + 's';
  }

  // Adres başına TEK indirme. Mozaikte yüzlerce kare var ama benzersiz
  // görsel yirmi küsur; kare başına istek açmak bant genişliğini
  // main.dart.js ile yarıştırırdı — açılışı hızlandırsın diye kurulan
  // ekran açılışı yavaşlatmış olurdu.
  var adresler = Object.keys(grup);
  var i2 = 0;
  function sonraki() {
    if (i2 >= adresler.length) return;
    var src = adresler[i2++];
    var yukleyici = new Image();
    yukleyici.onload = function () {
      var liste = grup[src];
      for (var n = 0; n < liste.length; n++) {
        liste[n].src = src;
        liste[n].classList.add('geldi');
      }
      sonraki();
    };
    yukleyici.onerror = sonraki;
    yukleyici.src = src;
  }
  sonraki(); sonraki();
}

kur();

document.getElementById('ayar').addEventListener('click', function (e) {
  var d = e.target.dataset.d;
  if (!d) return;
  var y = parseInt(e.target.dataset.y, 10);
  if (d === 'sifirla') { ELLE = false; BOY_AYAR = varsayilanBoy(); kur(); return; }
  ELLE = true;
  if (d === 'hiz') HIZ_AYAR = Math.max(10, Math.min(200, HIZ_AYAR + y));
  else if (d === 'boy') BOY_AYAR = Math.max(80, Math.min(420, BOY_AYAR + y));
  else if (d === 'serit') SERIT_AYAR = Math.max(0, Math.min(20, SERIT_AYAR + y));
  else LOGO_AYAR = Math.max(2, Math.min(30, LOGO_AYAR + y));
  kur();
});

// Ekran döndüğünde ya da pencere ölçüsü değiştiğinde yeniden kuruluyor:
// şerit ve kare sayısı görüntü alanından hesaplanıyor.
var zaman;
addEventListener('resize', function () {
  clearTimeout(zaman);
  zaman = setTimeout(function () {
    if (!ELLE) BOY_AYAR = varsayilanBoy();
    kur();
  }, 220);
});
