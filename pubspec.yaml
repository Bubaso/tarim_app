name: tarim_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Adres çubuğundaki `#`i kaldırmak için (bkz. lib/core/utils/url_strategy.dart).
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  flutter_riverpod: ^2.5.1
  supabase_flutter: ^2.5.4
  go_router: ^14.1.4
  intl: ^0.20.2
  url_launcher: ^6.3.0
  shared_preferences: ^2.2.3
  cached_network_image: ^3.4.1
  fl_chart: ^1.2.0
  flutter_html: ^3.0.0
  geolocator: ^14.0.2
  google_generative_ai: ^0.4.7
  html_editor_enhanced: ^2.7.1
  http: ^1.6.0
  image_picker: ^1.2.2
  share_plus: ^12.0.2
  shimmer: ^3.0.0
  uuid: ^4.5.3
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  firebase_analytics: ^12.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    # Sadece Font Awesome "Brands" seti. font_awesome_flutter paketi Free-Solid
    # ve Free-Regular'ı da manifest'e ekliyor ve Flutter web manifest'teki her
    # fontu açılışta indiriyor; hiç kullanmadığımız o iki dosya ~500 KB ölü
    # yük demekti. Sadece bu dosyayı bağlıyoruz, ikon tree-shaking'i onu da
    # kullanılan glif sayısına indiriyor.
    # Lisans: assets/fonts/FontAwesome-LICENSE.txt (CC BY 4.0 / SIL OFL 1.1)
    - family: FontAwesomeBrands
      fonts:
        - asset: assets/fonts/Font-Awesome-7-Brands-Regular-400.otf
